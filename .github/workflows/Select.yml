name: Selected Test Configuration Matrix

on:
  [push, pull_request]

jobs:
  test_config:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        config:
          - description: latest
            python-version: "3.13"
            rf-version: "7.4.2"
            selenium-version: "4.43.0"
            browser: chrome
          - description: previous
            python-version: "3.12"
            rf-version: "7.3.2"
            selenium-version: "4.38.0"
            browser: chrome
          - description: older_rf_version
            python-version: "3.11"
            rf-version: "6.1.1"
            selenium-version: "4.37.0"
            browser: chrome
          - description: latest
            python-version: "3.13"
            rf-version: "7.4.2"
            selenium-version: "4.43.0"
            browser: firefox
          - description: previous
            python-version: "3.12"
            rf-version: "7.3.2"
            selenium-version: "4.38.0"
            browser: firefox
          - description: older_rf_version
            python-version: "3.11"
            rf-version: "6.1.1"
            selenium-version: "4.37.0"
            browser: firefox

    steps:
    - uses: actions/checkout@v6
    - name: Configuration description
      run: |
        echo "${{ matrix.config.description }} configuration"
        echo "Testing with RF v${{ matrix.config.rf-version }}, Selenium v${{ matrix.config.selenium-version }}, Python v${{ matrix.config.python-version }} under ${{ matrix.config.browser }}"
    - name: Set up Python ${{ matrix.config.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.config.python-version }}
        cache: 'pip'
    - name: Setup Chrome
      if: matrix.config.browser == 'chrome'
      uses: browser-actions/setup-chrome@v2
      with:
        chrome-version: stable
        install-dependencies: true
        install-chromedriver: false   # let selenium manager handle this
    - name: Setup Firefox
      if: matrix.config.browser == 'firefox'
      uses: browser-actions/setup-firefox@v1
      with:
        firefox-version: latest
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
    - name: Install Selenium ${{ matrix.config.selenium-version }}
      run: |
        pip install --upgrade selenium==${{ matrix.config.selenium-version }}
    - name: Install Robot Framework ${{ matrix.config.rf-version }}
      run: |
        pip install --upgrade robotframework==${{ matrix.config.rf-version }}
    - name: Run tests
      run: |
        xvfb-run --auto-servernum python atest/run.py --zip ${{ matrix.config.browser }}
    - uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: sl_${{ matrix.config.python-version }}_${{ matrix.config.rf-version }}_${{ matrix.config.selenium-version }}_${{ matrix.config.browser }}
        path: atest/zip_results

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.13"
        cache: 'pip'
    - name: Install dev dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
    - name: Ruff format check
      run: |
        python -m invoke formatter --check
    - name: Ruff lint
      run: |
        python -m invoke lint
